const showU=()=>{const b=$('#ub');if(b)b.style.display=UNDO.length?'':'none'};
function pushU(o){UNDO.push(o);if(UNDO.length>30)UNDO.shift();showU()}

 if(u.k=='row'){ex.rows.splice(Math.min(u.i,ex.rows.length),0,u.row);persist();T='ex';render();flash('r_'+u.row.id)}
 else{let r=ex.rows.find(x=>x.id==u.r.id);if(!r){r=u.r;ex.rows.splice(Math.min(u.ri,ex.rows.length),0,r)}r.items.splice(Math.min(u.i,r.items.length),0,u.it);persist();T='ex';render();flash('i_'+u.it.id)}
 toast('حذف برگردانده شد')}

function mulb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function variantOf(e,L){if(!L)return e;const seed=[...(e.id+L)].reduce((h,c)=>Math.imul(h^c.charCodeAt(0),16777619)>>>0,2166136261),R=mulb(seed),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const c=structuredClone(e);c.rows=sh(c.rows);if(VOPT)c.rows.forEach(r=>r.items.forEach(it=>{if(it.type=='mc'){const ix=sh(it.opts.map((_,i)=>i));it.opts=ix.map(i=>it.opts[i]);it.ok=ix.indexOf(it.ok)}}));c.vl=L;return c}
